
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Chọn khóa học</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #003366;
      font-size: 28px;
    }
    .course-list {
      max-width: 800px;
      margin: 30px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .course-btn {
      padding: 14px;
      font-size: 18px;
      border: 2px solid #005580;
      border-radius: 8px;
      background-color: #fff;
      color: #005580;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      text-align: left;
    }
    .course-btn:hover {
      background-color: #005580;
      color: white;
    }
body::before {
  content: "";
  position: fixed;
  z-index: 0;
  left: 0; top: 0; right: 0; bottom: 0;
  width: 100vw; height: 100vh;
  background: url('image/logo_viettuan.png') no-repeat center center;
  background-size: 430px auto;
  opacity: 0.05;
  pointer-events: none;
 
}
  </style>
</head>
<body>
  <h2>📚 Danh sách Khóa học</h2>
  <div class="course-list">
    <a class="course-btn" href="daotao/" style="display:block;text-decoration:none;background:#f2b705;border-color:#5a3414;color:#2b1a0d">⭐ Khóa đào tạo nhân viên bán buôn – 3 ngày (bài học + kiểm tra chấm điểm)</a>
  </div>
  <div class="course-list" id="courseList"></div>

  <script>
    const sheetUrl = "https://opensheet.elk.sh/1rm7GNrbJFOw-P9ynBgM2hOi6aROM_Hj57KwxVrD5OdY/Courses";
    async function loadCourses() {
      const res = await fetch(sheetUrl);
      const data = await res.json();
      const container = document.getElementById("courseList");
      data.forEach(course => {
        const btn = document.createElement("button");
        btn.className = "course-btn";
        btn.textContent = `${course.id} - ${course.title}`;
        btn.onclick = () => window.location.href = `viewer.html?course=${course.id}`;
        container.appendChild(btn);
      });
    }
    loadCourses();
  </script>
</body>
</html>
